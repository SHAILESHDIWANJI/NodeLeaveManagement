<div class="dialog-backdrop" *ngIf="isOpen">

  <div class="dialog-box">

    <div class="dialog-header">
      <h2>Apply Leave</h2>
    </div>

    <div class="dialog-body">

      <div class="form-group">
        <label>From Date</label>
        <input
          type="date"
          [(ngModel)]="leaveData.fromDate"
        />
      </div>

      <div class="form-group">
        <label>To Date</label>
        <input
          type="date"
          [(ngModel)]="leaveData.toDate"
        />
      </div>

      <div class="form-group">
        <label>Reason</label>
        <textarea
          rows="4"
          placeholder="Enter reason"
          [(ngModel)]="leaveData.reason"
        ></textarea>
      </div>

    </div>

    <div class="dialog-footer">
      <button class="cancel-btn" (click)="onCancel()">
        Cancel
      </button>

      <button class="submit-btn" (click)="onSubmit()">
        Submit
      </button>
    </div>

  </div>

</div>
